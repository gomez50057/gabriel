<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Barras apiladas al 100 por ciento</title>
  <desc id="desc">Cada barra tiene la misma longitud y sus segmentos representan proporciones.</desc>
  <rect width="960" height="540" rx="24" fill="#141419"/>
  <g fill="#f5ead2" font-family="Arial, sans-serif" font-size="18"><text x="80" y="145">Tema 1</text><text x="80" y="245">Tema 2</text><text x="80" y="345">Tema 3</text></g>
  <g stroke="#141419" stroke-width="3"><path d="M210 115H850V170H210Z" fill="#691b32"/><path d="M210 115H390V170H210Z" fill="#b84b55"/><path d="M390 115H610V170H390Z" fill="#b8822d"/><path d="M610 115H850V170H610Z" fill="#e7bd70"/><path d="M210 215H850V270H210Z" fill="#691b32"/><path d="M210 215H300V270H210Z" fill="#b84b55"/><path d="M300 215H520V270H300Z" fill="#b8822d"/><path d="M520 215H790V270H520Z" fill="#e7bd70"/><path d="M790 215H850V270H790Z" fill="#f5ead2"/><path d="M210 315H850V370H210Z" fill="#691b32"/><path d="M210 315H470V370H210Z" fill="#b84b55"/><path d="M470 315H570V370H470Z" fill="#b8822d"/><path d="M570 315H700V370H570Z" fill="#e7bd70"/><path d="M700 315H850V370H700Z" fill="#f5ead2"/></g>
  <text x="448" y="450" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="18">Cada barra = 100 %</text>
</svg>
